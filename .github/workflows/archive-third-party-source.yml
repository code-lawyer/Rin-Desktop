name: Archive third-party source

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: Release currently holding the archive, for example v0.6.3-rc.4
        required: true
        type: string
      source_version:
        description: CPU source archive version, for example 0.3.1
        required: true
        type: string
      destination_release_id:
        description: Existing destination release ID
        required: true
        type: string
      destination_release_tag:
        description: Expected destination tag, for example v0.6.4-rc.1 or third-party-source-v0.3.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
      SOURCE_VERSION: ${{ inputs.source_version }}
      DESTINATION_ID: ${{ inputs.destination_release_id }}
      DESTINATION_RELEASE_TAG: ${{ inputs.destination_release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Copy and verify the corresponding source archive
        run: npm run source:archive -- --run
