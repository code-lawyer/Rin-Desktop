name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix prototypes/live2d-codex ci
      - run: npm run check:project
      - run: npm test
      - run: npm run build
      - run: npm run setup:electron
      - run: npm run qa:remote-component
      - run: powershell.exe -NoProfile -Command "Add-Type -Path 'prototypes/live2d-codex/scripts/wallpaper-pose-input.cs' -ReferencedAssemblies 'Accessibility.dll', 'System.dll', 'System.Core.dll'"
      - run: node tools/release/audit-public.mjs --staged
      - run: npm run check:public
