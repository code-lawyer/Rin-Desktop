<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作 → 看向你 · 画质对比</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#131817;color:#e9ede8}*{box-sizing:border-box}body{margin:0 auto;max-width:1680px;padding:32px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:24px;font-weight:550;margin:0 0 8px}p{color:#a9b5ae;line-height:1.6;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #526057;border-radius:7px;background:#202a24;color:inherit;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#dce7d8;color:#172218;border-color:#dce7d8}button:focus-visible,a:focus-visible{outline:3px solid #a9cfad;outline-offset:4px}.viewer{background:#090c0a;border:1px solid #303a33;border-radius:10px;overflow:hidden}video{display:block;width:100%;max-height:68vh;object-fit:contain;background:#090c0a}.caption{padding:11px 16px;color:#c2cec4;font-size:14px;display:flex;justify-content:space-between;gap:20px}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px}a{color:#c0d9bd;text-underline-offset:4px}details{margin-top:28px;border-top:1px solid #354038;padding-top:18px}summary{cursor:pointer;font-size:16px}details p{font-size:14px;margin:12px 0}img{max-width:100%;height:auto;display:block}#error{color:#ffb2a5}small{color:#9aa89f}@media(max-width:700px){body{padding:18px}h1{font-size:21px}.caption{flex-direction:column;gap:4px}}
</style>
<header><div><h1>工作 → 看向你</h1><p>同一条 4 秒试片，比较 720p 原片与本地超分 4K。</p></div><nav aria-label="画质对比模式"><button data-mode="split" aria-pressed="true">左右同步对比</button><button data-mode="source" aria-pressed="false">720p 原片</button><button data-mode="enhanced" aria-pressed="false">超分 4K</button></nav></header>
<main><div class="viewer"><video controls loop muted playsinline preload="auto" aria-label="工作到看向用户的对比视频" src="/comparison-left-original-right-4k.mp4"></video><div class="caption"><span id="mode-label">左：720p 原片　｜　右：超分 4K</span><span>静音预览 · 可暂停、拖动及全屏</span></div></div><p id="error" role="alert"></p>
<footer><small>保留原动作与逐帧时间点。4K 为超分结果，不是原生 4K。</small><div><a href="/original.mp4" download>保存原片</a>　<a href="/upscaled-4k.mp4" download>保存 4K</a>　<a href="/comparison-left-original-right-4k.mp4" download>保存对比</a></div></footer>
<details><summary>查看脸部细节对比</summary><p>同一时刻、相同区域。左：普通放大；右：Real-ESRGAN 超分。此图来自编码前的无损帧，方便查看皮肤与发丝处理。</p><img src="/face-comparison.png" alt="脸部局部对比，左侧普通放大，右侧超分" loading="lazy"></details></main>
<script>
const video=document.querySelector('video'),label=document.querySelector('#mode-label'),error=document.querySelector('#error'),buttons=[...document.querySelectorAll('button[data-mode]')];
const modes={split:['/comparison-left-original-right-4k.mp4','左：720p 原片　｜　右：超分 4K'],source:['/original.mp4','720p 原片 · 1280 × 720'],enhanced:['/upscaled-4k.mp4','超分 4K · 3840 × 2160']};
let selected='split',switchState=null;
buttons.forEach(button=>button.addEventListener('click',()=>{
  const mode=button.dataset.mode;if(mode===selected)return;
  switchState={time:switchState?.time??video.currentTime,playing:switchState?.playing??!video.paused};
  selected=mode;buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));label.textContent=modes[mode][1];error.textContent='';
  video.pause();video.src=modes[mode][0];video.load();
}));
video.addEventListener('loadedmetadata',()=>{if(!switchState)return;const pending=switchState;switchState=null;video.currentTime=Math.min(pending.time,Math.max(0,video.duration-.02));if(pending.playing)video.play().catch(()=>{});});
video.addEventListener('error',()=>{switchState=null;error.textContent='视频加载失败，请刷新页面重试。';});
</script>
</html>
